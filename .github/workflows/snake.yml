name: Profile graphics

# Once a day: redraws the pixel snake and the 3D contribution graph and pushes them
# to the `output` branch. No artifacts are uploaded, so it uses no Actions storage.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: true

jobs:
  graphics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pixel stats card (private contributions included)
        env:
          # Optional read-only token that can see private repos -> exact PR / review / repo counts.
          # Without it the card shows only calendar numbers, which already include private work.
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
        run: |
          mkdir -p dist
          python3 scripts/stats_card.py dist/pixel-stats.svg

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pixel-snake.svg?palette=github-light&color_snake=#ff8a3d
            dist/pixel-snake-dark.svg?palette=github-dark&color_snake=#ff8a3d&color_dots=#161b22,#1c1245,#7c5cff,#ff8a3d,#3df5ff

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/3d-settings.json

      # Radar chart, language donut and star/fork counters only see public repos: drop them.
      - name: Tidy the 3D graph
        run: python3 scripts/clean_3d.py profile-3d-contrib/profile-pixel.svg

      - name: Push to the output branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv profile-3d-contrib dist/
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Update profile graphics"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" output
