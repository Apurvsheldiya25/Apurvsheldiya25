name: Pixel snake

# Redraws the contribution-graph snake once a day and pushes it to the `output` branch.
# No artifacts are uploaded, so it uses no Actions storage.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pixel-snake.svg?palette=github-light&color_snake=#ff4fd8
            dist/pixel-snake-dark.svg?palette=github-dark&color_snake=#ff4fd8&color_dots=#161b22,#1c1245,#7c5cff,#ff4fd8,#3df5ff

      - name: Push to the output branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Update pixel snake"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" output
